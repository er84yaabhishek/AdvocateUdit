name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo Settings > Secrets and variables > Actions > Variables me CUSTOM_DOMAIN set karo
      # (e.g. "uditchaurasia.in"). Set hone par base path root ho jata hai.
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        env:
          NUXT_APP_BASE_URL: ${{ env.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          NUXT_PUBLIC_SITE_URL: ${{ env.CUSTOM_DOMAIN != '' && format('https://{0}/', env.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: npm run generate

      - name: Add CNAME for custom domain
        if: env.CUSTOM_DOMAIN != ''
        shell: bash
        run: echo "$CUSTOM_DOMAIN" > .output/public/CNAME

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
